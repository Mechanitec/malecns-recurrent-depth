[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns-rd"
version = "0.4.0"
description = "Recurrent-depth connectome research prototype with rate, LIF, and hybrid chess Elo benchmarking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
malecns = ["pyarrow>=14"]
chess = ["python-chess>=1.999"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
